# Railway deployment config:
#  - Force Dockerfile build (not Nixpacks auto-detect)
#  - Healthcheck on /health (Railway probes this on $PORT)
#  - Restart on failure with backoff
#
# We DO NOT set startCommand here — the Dockerfile CMD already uses $PORT
# correctly. Setting startCommand would override the Dockerfile and risk
# the port mismatch we just hit.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
