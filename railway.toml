# Railway deployment config — explicitly tells Railway:
#  - Build using the Dockerfile (not Nixpacks auto-detect)
#  - The app listens on $PORT (Railway-assigned, usually 8080)
#  - Health check path for the platform to know the app is up
#  - Restart on failure with a small backoff

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "uvicorn api:app --host 0.0.0.0 --port ${PORT:-8080}"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
